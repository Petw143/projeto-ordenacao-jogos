services:
  # Teste do sistema
  test:
    build: .
    container_name: ordenacao-test
    volumes:
      - ./data:/app/data
      - ./plots:/app/plots
      - ./relatorio:/app/relatorio
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
    command: ["python", "test_sistema.py"]

  # Execução do experimento completo
  run:
    build: .
    container_name: ordenacao-run
    volumes:
      - ./data:/app/data
      - ./plots:/app/plots
      - ./relatorio:/app/relatorio
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
    command: ["python", "src/main.py"]

  # Ambiente interativo para desenvolvimento
  shell:
    build: .
    container_name: ordenacao-shell
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
    command: ["bash"]
    stdin_open: true
    tty: true

  # Compilação do artigo LaTeX (português)
  latex:
    image: texlive/texlive:latest
    container_name: ordenacao-latex
    volumes:
      - .:/app
    working_dir: /app
    command: ["pdflatex", "-interaction=nonstopmode", "artigo_ieee_portugues.tex"]